plugins {
    id 'idea'
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = 'dev.gungang'
def versionState = file('version.properties')
def releaseProperties = new Properties()
versionState.withInputStream { releaseProperties.load(it) }
def nextUpdate = Integer.parseInt(releaseProperties.getProperty('update')) + 1
def releaseDate = java.time.LocalDate.now(java.time.ZoneId.of('Asia/Seoul'))
        .format(java.time.format.DateTimeFormatter.ofPattern('yyMMdd'))
def releaseName = "u${nextUpdate}_${releaseDate}"
// Forge rejects underscores in mods.toml versions; keep the requested label for the filename.
version = "${nextUpdate}.${releaseDate}"
base { archivesName = 'gungang-realistic_1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
// Explicit development-only server smoke checks; never included in a normal build/JAR.
if (project.hasProperty('gungangSmoke')) sourceSets.main.java.srcDir('src/smoke/java')
if (project.hasProperty('gungangClientSmoke')) sourceSets.main.java.srcDir('src/clientSmoke/java')

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { gungang_acoustics { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods { gungang_acoustics { source sourceSets.main } }
        }
    }
}

repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
// Optional local compatibility test dependency; no TaCZ binaries are bundled or required by this mod.
if (project.hasProperty('taczVersion')) {
    repositories { flatDir { dirs '.cache/compat' } }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    if (project.hasProperty('taczVersion')) {
        runtimeOnly fg.deobf("local.tacz:tacz-1.20.1:${project.property('taczVersion')}")
    }
}
mixin {
    add sourceSets.main, 'gungang_acoustics.refmap.json'
    config 'gungang_acoustics.mixins.json'
}
tasks.named('jar', Jar).configure {
    exclude 'dev/gungang/acoustics/server/GadgetSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/client/PreviewSmokeChecks*.class'
    archiveFileName = "gungang-realistic_1.20.1_${releaseName}.jar"
    manifest { attributes(['MixinConfigs': 'gungang_acoustics.mixins.json']) }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/mods.toml') { expand(modVersion: project.version) }
    from('font') {
        include 'Galmuri11-Bold.ttf', 'advanced_pixel_lcd-7.ttf'
        into 'assets/gungang_acoustics/font'
        rename { it.toLowerCase(java.util.Locale.ROOT).replace(' ', '-') }
    }
}
test { useJUnitPlatform() }

// Only a successful release build advances the persistent counter. Compile/test/run do not.
// exportJar also waits for the copy to succeed before committing the counter.
def commitRelease = {
    def temp = file('version.properties.tmp')
    temp.setText("# Last successful release build. The next build uses this number + 1.\nupdate=${nextUpdate}\n", 'UTF-8')
    java.nio.file.Files.move(temp.toPath(), versionState.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    logger.lifecycle("Release ${releaseName}: saved update counter ${nextUpdate}")
}
tasks.named('build').configure {
    dependsOn 'reobfJar'
    doLast { if (!gradle.taskGraph.hasTask(':exportJar')) commitRelease() }
}

// Export only this build's installable, reobfuscated artifact (never stale/dev/source JARs).
tasks.register('exportJar', Copy) {
    group = 'build'
    description = 'Build, test and copy the installable mod JAR into dist.'
    dependsOn 'build', 'reobfJar'
    from tasks.named('jar', Jar).flatMap { it.archiveFile }
    into layout.projectDirectory.dir('dist')
    doLast { commitRelease() }
}
