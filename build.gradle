plugins {
    id 'idea'
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = 'dev.gungang'
def versionState = file('version.properties')
def releaseProperties = new Properties()
versionState.withInputStream { releaseProperties.load(it) }
def nextUpdate = Integer.parseInt(releaseProperties.getProperty('update')) + 1
def releaseDate = java.time.LocalDate.now(java.time.ZoneId.of('Asia/Seoul'))
        .format(java.time.format.DateTimeFormatter.ofPattern('yyMMdd'))
def releaseName = "u${nextUpdate}_${releaseDate}"
// Forge rejects underscores in mods.toml versions; keep the requested label for the filename.
version = "${nextUpdate}.${releaseDate}"
base { archivesName = 'gungang-realistic_1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
if (project.hasProperty('gungangArrowSmoke')) sourceSets.main.java.srcDir('src/arrowSmoke/java')
if (project.hasProperty('gungangArrowClientSmoke')) sourceSets.main.java.srcDir('src/arrowClientSmoke/java')
// Explicit development-only server smoke checks; never included in a normal build/JAR.
if (project.hasProperty('gungangSmoke')) sourceSets.main.java.srcDir('src/smoke/java')
if (project.hasProperty('gungangClientSmoke')) sourceSets.main.java.srcDir('src/clientSmoke/java')
if (project.hasProperty('gungangLobbyUiSmoke')) sourceSets.main.java.srcDir('src/lobbyUiSmoke/java')
if (project.hasProperty('gungangPropSmoke')) sourceSets.main.java.srcDir('src/propSmoke/java')
if (project.hasProperty('gungangBotSmoke')) sourceSets.main.java.srcDir('src/botSmoke/java')
if (project.hasProperty('gungangAxeSmoke')) sourceSets.main.java.srcDir('src/axeSmoke/java')
if (project.hasProperty('gungangBowSmoke')) sourceSets.main.java.srcDir('src/bowSmoke/java')
if (project.hasProperty('gungangTurretSmoke')) sourceSets.main.java.srcDir('src/turretSmoke/java')
if (project.hasProperty('gungangLasSmoke')) sourceSets.main.java.srcDir('src/lasSmoke/java')
if (project.hasProperty('gungangOutlineSmoke')) sourceSets.main.java.srcDir('src/outlineSmoke/java')
if (project.hasProperty('gungangLobbySmoke')) sourceSets.main.java.srcDir('src/lobbySmoke/java')
if (project.hasProperty('gungangTurretClientSmoke')) sourceSets.main.java.srcDir('src/turretClientSmoke/java')

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            if (project.hasProperty('gungangRapierPreview')) property 'gungang.rapierPreview', 'true'
            workingDirectory project.file(project.hasProperty('gungangTurretClientSmoke') ? 'build/turret-client-smoke' : project.hasProperty('gungangAxeSmoke') ? 'build/axe-client-smoke' : 'run')
            if (project.hasProperty('gungangLobbyUiSmoke')) workingDirectory project.file('build/lobby-ui-smoke')
            property 'forge.logging.console.level', 'info'
            if (project.hasProperty('gungangArrowClientSmoke')) workingDirectory project.file('build/arrow-client-smoke')
            if (project.hasProperty('gungangScannerPreview')) property 'gungang.scannerPreview', 'true'
            if (project.hasProperty('gungangOrbitalPreview')) property 'gungang.orbitalPreview', 'true'
            mods { gungang_acoustics { source sourceSets.main } }
            if (project.hasProperty('gungangOutlineSmoke')) workingDirectory project.file('build/outline-client-smoke')
            if (project.hasProperty('gungangLobbySmoke')) workingDirectory project.file('build/lobby-client-smoke')
        }
        server {
            if (project.hasProperty('gungangLasSmoke')) property 'gungang.lasSmoke', 'true'
            workingDirectory project.file(project.hasProperty('gungangTurretSmoke') ? 'build/turret-smoke-run' : project.hasProperty('gungangBowSmoke') ? 'build/bow-smoke-run' : project.hasProperty('gungangAxeSmoke') ? 'build/axe-server-smoke' : project.hasProperty('gungangBotSmoke') ? 'build/bot-smoke-run' : project.hasProperty('gungangPropSmoke') ? 'build/prop-smoke-run' : project.hasProperty('gungangBombSmoke') ? 'build/bomb-smoke-run' : 'run-server')
            args '--nogui'
            if (project.hasProperty('gungangArrowSmoke')) workingDirectory project.file('build/arrow-smoke-run')
            if (project.hasProperty('gungangOutlineSmoke')) workingDirectory project.file('build/outline-server-smoke')
            if (project.hasProperty('gungangLobbySmoke')) workingDirectory project.file('build/lobby-server-smoke')
            if (project.hasProperty('gungangLasSmoke')) workingDirectory project.file('build/las-smoke-run')
            mods { gungang_acoustics { source sourceSets.main } }
        }
    }
}

repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
if (project.hasProperty('gungangBowSmoke')) repositories { flatDir { dirs 'server_resource/mods' } }
// Optional local compatibility test dependency; no TaCZ binaries are bundled or required by this mod.
if (project.hasProperty('taczVersion')) {
    repositories { flatDir { dirs '.cache/compat' } }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    if (project.hasProperty('gungangBowSmoke')) {
        ['tactical-military-bow-forge-1.20.1:1.0.4','tacz-1.20.1:1.1.8-hotfix2',
         'lrtactical-1.20.1:0.4.3','geckolib-forge-1.20.1:4.8.4','curios-forge:5.14.1+1.20.1'].each {
            runtimeOnly fg.deobf("local.bow:${it}")
        }
    }
    if (project.hasProperty('taczVersion')) {
        runtimeOnly fg.deobf("local.tacz:tacz-1.20.1:${project.property('taczVersion')}")
    }
}
mixin {
    add sourceSets.main, 'gungang_acoustics.refmap.json'
    config 'gungang_acoustics.mixins.json'
}
tasks.named('jar', Jar).configure {
    exclude 'dev/gungang/acoustics/server/ArrowGrenadeSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/client/ArrowGrenadeModelSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/client/LobbyUiSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/server/GadgetSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/client/PreviewSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/server/PropSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/server/BotSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/server/CompoundBowSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/server/TurretSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/server/Las5SmokeChecks*.class'
    exclude 'dev/gungang/acoustics/server/OutlineSmokeWorld*.class'
    exclude 'dev/gungang/acoustics/client/OutlineSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/server/LobbyKeySmokeWorld*.class'
    exclude 'dev/gungang/acoustics/client/LobbyKeySmokeChecks*.class'
    exclude 'dev/gungang/acoustics/client/TurretModelSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/server/HandAxeSmokeChecks*.class'
    exclude 'dev/gungang/acoustics/client/HandAxeSmokeChecks*.class'
    archiveFileName = "gungang-realistic_1.20.1_${releaseName}.jar"
    manifest { attributes(['MixinConfigs': 'gungang_acoustics.mixins.json']) }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/mods.toml') { expand(modVersion: project.version) }
    from('font') {
        include 'Galmuri11-Bold.ttf', 'advanced_pixel_lcd-7.ttf', 'gungang.ttf'
        into 'assets/gungang_acoustics/font'
        rename { it.toLowerCase(java.util.Locale.ROOT).replace(' ', '-') }
    }
}
test { useJUnitPlatform() }

// Only a successful release build advances the persistent counter. Compile/test/run do not.
// exportJar also waits for the copy to succeed before committing the counter.
def commitRelease = {
    def temp = file('version.properties.tmp')
    temp.setText("# Last successful release build. The next build uses this number + 1.\nupdate=${nextUpdate}\n", 'UTF-8')
    java.nio.file.Files.move(temp.toPath(), versionState.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    logger.lifecycle("Release ${releaseName}: saved update counter ${nextUpdate}")
}
tasks.named('build').configure {
    dependsOn 'reobfJar'
    doLast { if (!gradle.taskGraph.hasTask(':exportJar')) commitRelease() }
}

// Export only this build's installable, reobfuscated artifact (never stale/dev/source JARs).
tasks.register('exportJar', Copy) {
    group = 'build'
    description = 'Build, test and copy the installable mod JAR into dist.'
    dependsOn 'build', 'reobfJar'
    from tasks.named('jar', Jar).flatMap { it.archiveFile }
    into layout.projectDirectory.dir('dist')
    doLast { commitRelease() }
}
